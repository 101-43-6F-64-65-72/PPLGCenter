global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@studentcenter.smkn2surakarta.sch.id'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'production-email'
  routes:
    - match:
        severity: critical
      receiver: 'production-email'
      repeat_interval: 1h

receivers:
  - name: 'production-email'
    email_configs:
      - to: 'admin@studentcenter.smkn2surakarta.sch.id'
        send_resolved: true
        headers:
          subject: '[StudentCenter ALERT] {{ .CommonAnnotations.summary }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
