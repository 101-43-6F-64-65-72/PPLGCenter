groups:
  - name: studentcenter.production.alerts
    rules:
      - alert: BackendDown
        expr: up{job="studentcenter-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "StudentCenter backend is DOWN"
          description: "Backend API has been unreachable for more than 1 minute."

      - alert: HighRequestLatency
        expr: http_request_duration_seconds{quantile="0.95"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency detected"
          description: "p95 response time exceeds 2s for 5+ minutes."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is DOWN"
          description: "Database unreachable for more than 1 minute."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 450
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Backend memory usage exceeds 450MB."
