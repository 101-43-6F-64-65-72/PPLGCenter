global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'studentcenter-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5051']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
