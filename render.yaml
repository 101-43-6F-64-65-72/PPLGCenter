# Render Infrastructure as Code Blueprint
# Render Deployment Specification for PPLGCenter (.NET Backend + PostgreSQL + Persistent Disk)
# NOTE: Set all envVars marked 'sync: false' or with empty 'value' via the Render dashboard before deploying.

services:
  - type: web
    name: pplgcenter-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: pplgcenter-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ISSUER
        value: PPLGCenter
      - key: JWT_AUDIENCE
        value: PPLGCenterApp
      - key: CORS__AllowedOrigins
        sync: false   # Set via Render dashboard once PPLGCenter domain is known
      - key: UPLOAD_PATH
        value: /app/wwwroot/uploads
    disk:
      name: uploads-disk
      mountPath: /app/wwwroot/uploads
      sizeGB: 1

databases:
  - name: pplgcenter-db
    databaseName: pplgcenter
    user: pplgcenter_user
    region: singapore
    plan: starter
